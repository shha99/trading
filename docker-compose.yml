services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - REFRESH_INTERVAL_MINUTES=15
      - ENABLE_SCHEDULER=true
      - CORS_ORIGINS=*
    volumes:
      - signal-data:/app/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  signal-data:
