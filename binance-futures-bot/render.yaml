# Render 무료(Free) 웹 서비스 플랜 기준 설정.
#
# 무료 플랜은 영구 디스크(persistent disk)를 붙일 수 없어 (Starter 이상 유료
# 플랜 전용 기능) data/ 아래 파일(strategy_stats.json, lab_stats.json, bot.db)이
# 재배포/재시작마다 초기화된다. 성적표 두 개는 서버가 켜질 때 파일이 없으면
# server.py가 자동으로 다시 만들어주므로(app.py on_startup) 문제 없지만,
# 거래/시그널 기록(SQLite)은 재시작마다 비워진다 — 지금은 테스트넷+자동매매
# 꺼짐 상태라 문제 없음. 나중에 기록을 계속 남기고 싶으면 Starter 플랜으로
# 올리고 이 파일에 `disk:` 섹션을 추가하면 됨.
#
# 무료 플랜은 ~15분 미접속 시 슬립 상태로 들어가고, 다음 요청 때 깨어나는데
# 1분 정도 걸린다 — 그 사이엔 실시간 시세 폴링/웹소켓도 멈춰있다가 요청이
# 오면 다시 시작됨.
#
# rootDir: 저장소 최상단이 아니라 binance-futures-bot/ 폴더 기준으로 빌드/실행
# 명령이 돌게 지정 (requirements.txt, server.py가 그 안에 있음).
# PYTHON_VERSION: Render 기본값(최신 버전)은 TA-Lib 사전빌드 wheel이 아직
# 없을 수 있어, 이 프로젝트에서 검증된 3.11로 고정.
services:
  - type: web
    name: binance-futures-bot
    runtime: python
    plan: free
    rootDir: binance-futures-bot
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BINANCE_TESTNET
        value: "true"
      - key: AUTO_TRADE_ENABLED
        value: "false"
      - key: AUTO_TRADE_WHITELIST
        value: ""
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
